<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2638">
<title>LabBot Rescue · Marcador</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0a2638;--bg2:#0f3550;--panel:#133f5c;--panel2:#184a6b;--line:rgba(255,255,255,.13);
  --txt:#e9f0f5;--mut:#9db6c7;--or:#f2a63b;--or2:#ffc067;--gr:#7ed957;--red:#e5484d;--red2:#b32f34;--blue:#3b82f6;--blue2:#2559b5;
  --ok:#3fb27f;--bad:#ff6b6b;
  --f-disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--f-body:'Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f-body);font-size:16px;line-height:1.4}
body{min-height:100vh}
h1,h2,h3{font-family:var(--f-disp);margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:28px;font-weight:700}h3{font-size:22px;font-weight:700}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--txt);background:#0b2f47;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--or)}
.mut{color:var(--mut)}.num{font-variant-numeric:tabular-nums}.disp{font-family:var(--f-disp)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
/* botones */
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--panel2);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--or);color:#2a1a00}.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}
.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.danger{background:var(--bad);color:#2a0000}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:9px}.btn.lg{padding:15px 24px;font-size:18px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-block;border-radius:99px;padding:3px 11px;font-size:13px;font-weight:600;background:var(--panel2);color:var(--txt);white-space:nowrap}
.chip.red{background:var(--red)}.chip.blue{background:var(--blue)}.chip.or{background:var(--or);color:#2a1a00}.chip.gr{background:var(--ok);color:#03210f}.chip.mut{background:rgba(255,255,255,.1);color:var(--mut)}
/* barra superior */
.top{position:sticky;top:0;z-index:30;background:rgba(8,30,46,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{display:flex;align-items:center;gap:12px;padding-block:8px;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.top img.lg{height:38px;width:auto;border-radius:6px;flex:none}
.top .in{flex-wrap:nowrap}.top .grow{min-width:0}.top .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.top .sub,.hide-sm{display:none}.top .in{gap:8px}.top .btn.sm{padding:6px 9px}}
.top .ttl{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.03em;line-height:1}
.top .sub{font-size:12px;color:var(--mut)}
.tbar{background:#06202f;border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:29}
.tbar .in{display:flex;align-items:center;gap:14px;padding-block:6px;max-width:1180px;margin:0 auto}
.tbar .clk{font-family:var(--f-disp);font-size:34px;font-weight:700;line-height:1;min-width:64px;font-variant-numeric:tabular-nums}
.tbar .ph{font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:.08em;padding:4px 12px;border-radius:8px;background:var(--panel2)}
.tbar .ph.auto{background:var(--or);color:#2a1a00}.tbar .ph.tele{background:var(--ok);color:#03210f}.tbar .ph.end{background:#a78bfa;color:#160a3a}.tbar .ph.ended{background:var(--red)}.tbar .ph.countdown{background:#fff;color:#000}
.tbar .warn{background:var(--bad);color:#2a0000;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700}
/* menú */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding-block:34px}
.hero img.logo{width:170px;height:auto}
.hero h1{font-size:clamp(34px,6vw,60px);font-weight:800;line-height:.95}
.hero h1 em{font-style:normal;color:var(--or)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;padding-bottom:30px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);border-radius:18px;padding:18px;background:linear-gradient(160deg,var(--panel),var(--bg2));text-decoration:none;color:var(--txt);position:relative;overflow:hidden;min-height:120px}
.tile b{font-family:var(--f-disp);font-size:26px;font-weight:700}
.tile span{color:var(--mut);font-size:14px}
.tile.red{border-color:var(--red);background:linear-gradient(160deg,#5a1f27,var(--bg2))}.tile.blue{border-color:var(--blue);background:linear-gradient(160deg,#1c3c78,var(--bg2))}
.tile.lock{opacity:.4;pointer-events:none}
.tile .lk{position:absolute;right:14px;top:12px;font-size:12px}
.sponsors{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:18px 0 40px}
.sponsors .pill{background:#f2f6f9;border-radius:14px;padding:8px 16px;display:flex;align-items:center}
.sponsors img{height:44px;width:auto}
/* tarjetas, tablas */
.card{background:linear-gradient(170deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:16px}
.card.red{border-color:var(--red)}.card.blue{border-color:var(--blue)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:8px 16px;white-space:nowrap;font-weight:600}
.tabs button.on{background:var(--or);color:#2a1a00;border-color:var(--or)}
table{border-collapse:collapse;width:100%}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;white-space:nowrap}
.tw{overflow-x:auto}
tr.click{cursor:pointer}tr.click:hover{background:rgba(255,255,255,.05)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.field input,.field select{font-size:16px}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);width:100%;text-align:left}
.mrow.on{border-color:var(--or);background:rgba(242,166,59,.1)}
.vs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tn{font-family:var(--f-disp);font-weight:700;font-size:20px;padding:0 8px;border-radius:7px}
.tn.red{background:var(--red2)}.tn.blue{background:var(--blue2)}
/* modal / toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal.open{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:460px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.mbox.wide{max-width:760px}.mbox p{margin:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:var(--ok);color:#03210f;font-weight:700;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--bad);color:#2a0000}
/* ===== referee ===== */
.refwrap{padding-bottom:230px !important}
.robots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.rbtn{border:2px solid var(--line);border-radius:16px;background:rgba(255,255,255,.04);padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.rbtn .n{font-family:var(--f-disp);font-size:34px;font-weight:800;line-height:1}
.rbtn .p{font-size:13px;color:var(--mut)}
.rbtn.on.red{border-color:var(--red);background:rgba(229,72,77,.18)}.rbtn.on.blue{border-color:var(--blue);background:rgba(59,130,246,.2)}
.cam{background:linear-gradient(#0d3a56,#0a2d44);border:1px solid var(--line);border-radius:18px;padding:8px}
.cam svg{width:100%;height:auto;display:block;user-select:none;touch-action:manipulation}
.cam .col{cursor:pointer}.cam .col:active .bodyr{filter:brightness(1.25)}
@keyframes drop{0%{transform:translateY(-90px);opacity:0}60%{transform:translateY(4px);opacity:1}100%{transform:translateY(0)}}
.cube.drop{animation:drop .45s ease-out}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.plus{animation:pulse 1.6s infinite}
.minus3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tog{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tog .btn{flex:1;min-width:150px;border:2px solid var(--line);background:transparent;padding:14px}
.tog .btn.on{background:var(--ok);color:#03210f;border-color:var(--ok)}
.foul{margin-top:14px}
.foul .bs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.foul .btn{padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;line-height:1.1}
.foul .btn b{font-family:var(--f-disp);font-size:26px}
.log{margin-top:14px;font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(6,28,43,.97);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
.pbar .in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pbar button{border:2px solid var(--line);background:transparent;border-radius:14px;padding:12px 4px;font-family:var(--f-disp);font-size:22px;font-weight:700;letter-spacing:.05em;position:relative}
.pbar button.on{background:var(--or);color:#2a1a00;border-color:var(--or)}
.pbar button.live::after{content:'';position:absolute;top:8px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
.pbar .note{grid-column:1/-1;text-align:center;font-size:12px;color:var(--mut)}
.scoreline{display:flex;gap:10px;align-items:baseline}
.bigscore{font-family:var(--f-disp);font-size:46px;font-weight:800;line-height:1}
/* head */
.bar2{height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--or)}
.clockbig{font-family:var(--f-disp);font-size:84px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.opt{border:2px solid var(--line);border-radius:14px;padding:10px 6px;background:transparent;text-align:center;display:flex;flex-direction:column;gap:2px}
.opt b{font-family:var(--f-disp);font-size:26px}.opt.on{border-color:var(--or);background:rgba(242,166,59,.14)}.opt.rec{border-color:var(--gr)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
/* ===== STREAM ===== */
body.stream{overflow:hidden;background:#04131d}
body.stream.overlay{background:transparent}
html:has(body.stream.overlay){background:transparent!important}
.sbox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:1920px;height:1080px;position:relative;flex:none;transform-origin:center center;font-family:var(--f-body)}
.stage .bg{position:absolute;inset:0;background:radial-gradient(1200px 700px at 50% 20%,#14507a 0%,#0a2638 55%,#04131d 100%)}
.stage .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(900px 600px at 50% 40%,#000,transparent)}
.scene{position:absolute;inset:0;animation:sceneIn .6s ease-out}
@keyframes sceneIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.sfoot{position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;gap:20px;align-items:center}
.sfoot .pill{background:#f2f6f9;border-radius:18px;padding:10px 22px;display:flex;align-items:center;height:72px}
.sfoot img{height:50px}.sfoot .tx{font-family:var(--f-disp);font-size:30px;letter-spacing:.14em;color:var(--mut)}
.s-title{position:absolute;top:56px;left:0;right:0;text-align:center;font-family:var(--f-disp);font-weight:800;font-size:92px;letter-spacing:.06em;line-height:1}
.s-title small{display:block;font-size:34px;color:var(--or);letter-spacing:.3em;font-weight:600;margin-bottom:6px}
/* espera */
.wait-logo{position:absolute;left:130px;top:170px;width:520px;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.wait-info{position:absolute;left:760px;right:100px;top:200px}
.wait-info .k{font-family:var(--f-disp);font-size:44px;letter-spacing:.3em;color:var(--or);font-weight:600}
.wait-info .m{font-family:var(--f-disp);font-size:150px;font-weight:800;line-height:1}
.wait-info .t{font-family:var(--f-disp);font-size:60px;color:var(--mut)}
.vsrow{display:flex;gap:36px;margin-top:40px;align-items:stretch}
.alli{flex:1;border-radius:22px;padding:22px 26px;min-width:0}
.alli.red{background:linear-gradient(160deg,#b32f34,#6e1a20)}.alli.blue{background:linear-gradient(160deg,#2559b5,#143469)}
.alli .l{font-family:var(--f-disp);font-size:34px;letter-spacing:.2em;font-weight:600;opacity:.9}
.alli .tns{display:flex;gap:24px;font-family:var(--f-disp);font-weight:800;font-size:96px;line-height:1.05}
.runbot{position:absolute;right:50px;bottom:60px;width:240px;animation:run 3.2s ease-in-out infinite}
@keyframes run{0%,100%{transform:translateX(0) rotate(-2deg)}50%{transform:translateX(-40px) rotate(2deg)}}
/* live */
.live-top{position:absolute;top:34px;left:50%;transform:translateX(-50%);text-align:center;width:560px}
.live-top .ph{font-family:var(--f-disp);font-size:44px;font-weight:700;letter-spacing:.25em;padding:6px 40px;border-radius:14px;display:inline-block;background:var(--panel2)}
.live-top .ph.auto{background:var(--or);color:#2a1a00}.live-top .ph.tele{background:var(--ok);color:#03210f}.live-top .ph.end{background:#a78bfa;color:#160a3a}.live-top .ph.ended{background:var(--red)}.live-top .ph.countdown{background:#fff;color:#000}
.live-top .clk{font-family:var(--f-disp);font-size:230px;font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;text-shadow:0 8px 40px rgba(0,0,0,.5)}
.live-top .ml{font-family:var(--f-disp);font-size:40px;letter-spacing:.2em;color:var(--mut)}
.side{position:absolute;top:70px;width:640px;border-radius:30px;padding:28px 34px}
.side.red{left:44px;background:linear-gradient(160deg,#c23a40,#5d161c);box-shadow:0 0 80px rgba(229,72,77,.35)}
.side.blue{right:44px;background:linear-gradient(160deg,#2f69cf,#12295a);box-shadow:0 0 80px rgba(59,130,246,.35)}
.side .l{font-family:var(--f-disp);font-size:36px;letter-spacing:.25em;font-weight:600}
.side .tns{font-family:var(--f-disp);font-weight:800;font-size:110px;line-height:1.05;display:flex;gap:30px}
.side .sc{font-family:var(--f-disp);font-weight:800;font-size:330px;line-height:.9;font-variant-numeric:tabular-nums}
.side.blue{text-align:right}.side.blue .tns{justify-content:flex-end}.side.blue .bdg{justify-content:flex-end}
.side .lv{display:flex;gap:16px;margin-top:10px}.side.blue .lv{justify-content:flex-end}
.lvb{background:rgba(0,0,0,.28);border-radius:16px;padding:8px 24px;text-align:center}
.lvb b{font-family:var(--f-disp);font-size:68px;display:block;line-height:1}.lvb span{font-size:22px;letter-spacing:.14em;opacity:.8}
.bdg{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.bdg .b{font-family:var(--f-disp);font-size:30px;font-weight:700;letter-spacing:.1em;padding:4px 18px;border-radius:99px;background:rgba(0,0,0,.28);color:rgba(255,255,255,.55)}
.bdg .b.on{background:var(--gr);color:#07200a;box-shadow:0 0 24px var(--gr)}
.mid-bot{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:420px}
.banner{position:absolute;left:0;right:0;top:380px;text-align:center;z-index:5;pointer-events:none}
.banner b{display:inline-block;font-family:var(--f-disp);font-size:200px;font-weight:800;letter-spacing:.12em;padding:0 80px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.75) 15%,rgba(0,0,0,.75) 85%,transparent);animation:ban 2.2s ease both}
@keyframes ban{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.05)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
.cdnum{position:absolute;left:0;right:0;top:300px;text-align:center;font-family:var(--f-disp);font-size:520px;font-weight:800;z-index:5;animation:cd 1s ease-out infinite}
@keyframes cd{0%{transform:scale(1.5);opacity:0}30%{opacity:1;transform:scale(1)}100%{opacity:.2;transform:scale(.9)}}
/* review */
.rv-bot{position:absolute;right:80px;bottom:90px;width:430px;animation:peek 1.2s ease-out both}
@keyframes peek{from{transform:translateX(300px);opacity:0}to{transform:none;opacity:1}}
.rv-t{position:absolute;left:100px;top:130px;font-family:var(--f-disp);font-weight:800;font-size:150px;line-height:.95;letter-spacing:.03em}
.rv-t span{color:var(--or)}
.dots i{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--or);margin-right:14px;animation:pulse 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.rv-sc{position:absolute;left:100px;top:470px;display:flex;gap:50px;align-items:center}
.rv-sc .p{font-family:var(--f-disp);font-size:200px;font-weight:800;line-height:1;padding:10px 54px;border-radius:26px;min-width:340px;text-align:center;font-variant-numeric:tabular-nums}
.rv-sc .p.red{background:var(--red2)}.rv-sc .p.blue{background:var(--blue2)}
.rv-sc small{display:block;font-size:34px;letter-spacing:.2em;opacity:.8;font-weight:600}
/* results */
.res-h{position:absolute;top:40px;left:0;right:0;text-align:center;font-family:var(--f-disp);font-size:60px;letter-spacing:.3em;color:var(--or);font-weight:700;animation:fadeUp .6s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-400px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(400px)}to{opacity:1;transform:none}}
.rp{position:absolute;top:130px;width:820px;border-radius:30px;padding:24px 40px;text-align:center}
.rp.red{left:70px;background:linear-gradient(160deg,#c23a40,#5d161c);animation:slideL .8s .5s both}
.rp.blue{right:70px;background:linear-gradient(160deg,#2f69cf,#12295a);animation:slideR .8s .5s both}
.rp .l{font-family:var(--f-disp);font-size:40px;letter-spacing:.25em;font-weight:600}
.rp .tns{font-family:var(--f-disp);font-size:90px;font-weight:800;display:flex;gap:30px;justify-content:center;line-height:1.1}
.rp .sc{font-family:var(--f-disp);font-size:300px;font-weight:800;line-height:.95;font-variant-numeric:tabular-nums}
.rp.win{box-shadow:0 0 0 8px #ffd34d,0 0 120px #ffd34d;animation:slideL .8s .5s both,glow 1.6s 2.6s infinite alternate}
.rp.blue.win{animation:slideR .8s .5s both,glow 1.6s 2.6s infinite alternate}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.25)}}

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, getDoc, getDocFromServer, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch, runTransaction, increment, arrayUnion, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
// ===== LÓGICA PURA (sin Firebase, sin DOM). Se prueba con node. =====
const MATCH_MS = 150000, AUTO_MS = 15000, ENDGAME_MS = 120000, COUNTDOWN_MS = 3000;
const PTS = {
  auto: { 1: 5, 2: 10, 3: 18 }, tele: { 1: 2, 2: 6, 3: 15 }, end: { 1: 2, 2: 6, 3: 15 },
  line: 5, plat: 10, crit: 35, foul: 4, tech: 8,
};
const DOMINIO = 10;

function emptyRobot() {
  return { a: { 1: 0, 2: 0, 3: 0 }, t: { 1: 0, 2: 0, 3: 0 }, e: { 1: 0, 2: 0, 3: 0 },
    line: 0, plat: 0, crit: 0, fouls: 0, techs: 0, yellow: 0, red: 0 };
}
function phaseAt(elapsed) {
  if (elapsed < 0) return 'countdown';
  if (elapsed < AUTO_MS) return 'auto';
  if (elapsed < ENDGAME_MS) return 'tele';
  if (elapsed < MATCH_MS) return 'end';
  return 'ended';
}
const PHASE_NAME = { countdown: 'PREPARADOS', auto: 'AUTÓNOMO', tele: 'TELEOP', end: 'ENDGAME', ended: 'FIN', idle: 'ESPERA' };
function remainingMs(elapsed) { return Math.max(0, MATCH_MS - Math.max(0, elapsed)); }
function fmtClock(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function n(x) { return Number(x) || 0; }
function sumLv(o, tbl) { return [1, 2, 3].reduce((s, l) => s + n(o && o[l]) * tbl[l], 0); }

function robotPoints(r) {
  r = r || emptyRobot();
  const auto = n(r.line) * PTS.line + sumLv(r.a, PTS.auto);
  const tele = sumLv(r.t, PTS.tele);
  const end = sumLv(r.e, PTS.end) + n(r.plat) * PTS.plat + n(r.crit) * PTS.crit;
  return { auto, tele, end, total: auto + tele + end, samples: cnt(r.a) + cnt(r.t) + cnt(r.e) };
}
function levelTotals(r) {
  r = r || emptyRobot(); const o = { 1: 0, 2: 0, 3: 0 };
  [1, 2, 3].forEach(l => { o[l] = n(r.a && r.a[l]) + n(r.t && r.t[l]) + n(r.e && r.e[l]); }); return o;
}

// Resumen de una alianza a partir de su documento de score y la lista de equipos del match.
function allianceSummary(doc, teams) {
  const robots = {}; let auto = 0, tele = 0, end = 0, samples = 0, fouls = 0, techs = 0, yellow = 0, red = 0;
  let lineAll = teams.length > 0, crit = 0, plat = 0;
  const lv = { 1: 0, 2: 0, 3: 0 };
  teams.forEach(t => {
    const r = (doc && doc.robots && doc.robots[t]) || emptyRobot();
    const p = robotPoints(r); const L = levelTotals(r);
    robots[t] = { ...p, line: n(r.line), plat: n(r.plat), crit: n(r.crit), fouls: n(r.fouls), techs: n(r.techs),
      yellow: n(r.yellow), red: n(r.red), lv: L };
    auto += p.auto; tele += p.tele; end += p.end; samples += p.samples;
    fouls += n(r.fouls); techs += n(r.techs); yellow += n(r.yellow); red += n(r.red);
    if (!n(r.line)) lineAll = false; crit += n(r.crit); plat += n(r.plat);
    [1, 2, 3].forEach(l => lv[l] += L[l]);
  });
  return { robots, auto, tele, end, base: auto + tele + end, samples, fouls, techs, yellow, red, lineAll, crit, plat, lv };
}

// Resultado completo del match. Falta cometida por X suma puntos al rival.
function matchResult(match, redDoc, blueDoc, opts) {
  const hide = !!(opts && opts.hideRed); // la tarjeta roja no se refleja hasta publicar
  const R = allianceSummary(redDoc, match.red || []), B = allianceSummary(blueDoc, match.blue || []);
  const fin = (me, opp) => {
    const foulPts = opp.fouls * PTS.foul + opp.techs * PTS.tech;
    const redCard = me.red > 0 && !hide;
    const score = redCard ? 0 : me.base + foulPts;
    return { ...me, foulPts, redCard, redPending: hide && me.red > 0, score };
  };
  const r = fin(R, B), b = fin(B, R);
  const winner = r.score > b.score ? 'red' : b.score > r.score ? 'blue' : 'tie';
  const rp = (me, color) => {
    if (me.redCard) return { line: 0, crit: 0, dom: 0, res: 0, total: 0 };
    const line = me.lineAll ? 1 : 0, crit = me.crit > 0 ? 1 : 0, dom = me.samples >= DOMINIO ? 1 : 0;
    const res = winner === color ? 2 : winner === 'tie' ? 1 : 0;
    return { line, crit, dom, res, total: line + crit + dom + res };
  };
  r.rp = rp(r, 'red'); b.rp = rp(b, 'blue');
  return { red: r, blue: b, winner };
}
// Versión compacta para guardar en el match al publicar.
function packResult(match, res) {
  const side = s => ({ score: s.score, base: s.base, auto: s.auto, tele: s.tele, end: s.end, foulPts: s.foulPts,
    samples: s.samples, lv: s.lv, redCard: s.redCard, rp: s.rp, robots: s.robots, plat: s.plat, crit: s.crit, lineAll: s.lineAll,
    fouls: s.fouls, techs: s.techs, yellow: s.yellow, red: s.red });
  return { winner: res.winner, red: side(res.red), blue: side(res.blue) };
}

function isPub(m) { return m && m.status === 'published' && m.result; }

function rankings(teams, matches) {
  const rows = {}; teams.forEach(t => rows[t.id] = { id: t.id, rp: 0, played: 0, pts: 0, auto: 0, w: 0, l: 0, t: 0 });
  matches.filter(m => m.type === 'qual' && isPub(m)).forEach(m => {
    ['red', 'blue'].forEach(c => {
      const s = m.result[c], o = m.result[c === 'red' ? 'blue' : 'red'];
      (m[c] || []).forEach(tid => {
        const r = rows[tid]; if (!r) return;
        r.rp += s.rp.total; r.played++; r.pts += s.score; r.auto += s.auto;
        if (m.result.winner === 'tie') r.t++; else if (m.result.winner === c) r.w++; else r.l++;
      });
    });
  });
  const list = Object.values(rows).sort((a, b) => b.rp - a.rp || b.pts - a.pts || b.auto - a.auto || a.id.localeCompare(b.id));
  const o = oprAll(teams, matches);
  list.forEach((r, i) => { r.rank = i + 1; r.opr = o[r.id] || 0; r.avgPts = r.played ? r.pts / r.played : 0; r.avgRP = r.played ? r.rp / r.played : 0; });
  return list;
}

function solve(A, b) { // Gauss con pivoteo parcial
  const N = b.length; const M = A.map((row, i) => [...row, b[i]]);
  for (let c = 0; c < N; c++) {
    let p = c; for (let r = c + 1; r < N; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    if (Math.abs(M[c][c]) < 1e-12) continue;
    for (let r = 0; r < N; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k <= N; k++) M[r][k] -= f * M[c][k]; }
  }

}
function oprAll(teams, matches, filter) {
  const idx = {}; teams.forEach((t, i) => idx[t.id] = i); const N = teams.length;
  const rows = [];
  matches.filter(m => (filter ? filter(m) : m.type === 'qual') && isPub(m)).forEach(m => {
    ['red', 'blue'].forEach(c => { rows.push({ t: (m[c] || []).filter(x => x in idx), y: m.result[c].score }); });
  });
  const out = {}; if (!rows.length) { teams.forEach(t => out[t.id] = 0); return out; }
  const A = Array.from({ length: N }, () => Array(N).fill(0)), b = Array(N).fill(0);
  rows.forEach(r => r.t.forEach(i => { b[idx[i]] += r.y; r.t.forEach(j => A[idx[i]][idx[j]] += 1); }));
  const lam = 0.05; for (let i = 0; i < N; i++) A[i][i] += lam;
  const x = solve(A, b); teams.forEach((t, i) => out[t.id] = x[i]); return out;
}

// Estadísticas por robot a partir de los resultados publicados.
function teamStats(tid, matches, filter) {
  const ms = matches.filter(m => isPub(m) && (filter ? filter(m) : m.type !== 'practice') &&
    ((m.red || []).includes(tid) || (m.blue || []).includes(tid)));
  const s = { n: ms.length, auto: 0, tele: 0, end: 0, total: 0, lv: { 1: 0, 2: 0, 3: 0 }, plat: 0, crit: 0, line: 0, fouls: 0, techs: 0, yellow: 0, red: 0, samples: 0, rows: [] };
  ms.forEach(m => {
    const c = (m.red || []).includes(tid) ? 'red' : 'blue'; const r = m.result[c].robots && m.result[c].robots[tid]; if (!r) return;
    s.auto += r.auto; s.tele += r.tele; s.end += r.end; s.total += r.total; s.plat += r.plat; s.crit += r.crit; s.line += r.line;
    s.fouls += r.fouls; s.techs += r.techs; s.yellow += r.yellow; s.red += r.red; s.samples += r.samples;
    [1, 2, 3].forEach(l => s.lv[l] += (r.lv && r.lv[l]) || 0);
    s.rows.push({ id: m.id, label: m.label, color: c, pts: r.total, score: m.result[c].score, win: m.result.winner === c });
  });
  return s;
}

// ===== Rol de matches =====
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function schedCost(ms, nT, M) {
  const p = {}, o = {}, red = {}; let back = 0;
  const key = (a, b) => a < b ? a + '|' + b : b + '|' + a;
  ms.forEach((m, i) => {
    const [a, b] = m.red, [c, d] = m.blue;
    p[key(a, b)] = (p[key(a, b)] || 0) + 1; p[key(c, d)] = (p[key(c, d)] || 0) + 1;
    [a, b].forEach(x => { red[x] = (red[x] || 0) + 1; [c, d].forEach(y => { o[key(x, y)] = (o[key(x, y)] || 0) + 1; }); });
    if (i > 0) { const prev = new Set([...ms[i - 1].red, ...ms[i - 1].blue]); [a, b, c, d].forEach(x => { if (prev.has(x)) back++; }); }
  });
  let cp = 0, co = 0, cc = 0; Object.values(p).forEach(v => cp += v * v); Object.values(o).forEach(v => co += v * v);
  Object.values(red).forEach(v => cc += (v - M / 2) * (v - M / 2));
  return cp * 6 + co * 3 + back * 1 + cc * 2;
}
function schedStats(ms, teamIds) {
  const p = {}, o = {}, red = {}; teamIds.forEach(t => red[t] = 0);
  const key = (a, b) => a < b ? a + '|' + b : b + '|' + a;
  ms.forEach(m => { p[key(...m.red)] = (p[key(...m.red)] || 0) + 1; p[key(...m.blue)] = (p[key(...m.blue)] || 0) + 1;
    m.red.forEach(x => { red[x]++; m.blue.forEach(y => o[key(x, y)] = (o[key(x, y)] || 0) + 1); }); });
  const pairs = []; for (let i = 0; i < teamIds.length; i++) for (let j = i + 1; j < teamIds.length; j++) pairs.push(key(teamIds[i], teamIds[j]));
  const pv = pairs.map(k => p[k] || 0), ov = pairs.map(k => o[k] || 0);
  let back = 0; ms.forEach((m, i) => { if (i) { const prev = new Set([...ms[i - 1].red, ...ms[i - 1].blue]); [...m.red, ...m.blue].forEach(x => { if (prev.has(x)) back++; }); } });
  const rv = Object.values(red);
  return { partnerMin: Math.min(...pv), partnerMax: Math.max(...pv), oppMin: Math.min(...ov), oppMax: Math.max(...ov), back, redMin: Math.min(...rv), redMax: Math.max(...rv) };
}
function genSchedule(teamIds, M, seed, iters) {
  const nT = teamIds.length; if (nT % 4 || nT < 4) throw new Error('Se necesitan equipos en múltiplos de 4');
  const rng = mulberry(seed == null ? Date.now() : seed); const per = nT / 4;
  const rounds = [];
  for (let r = 0; r < M; r++) {
    const a = teamIds.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    for (let k = 0; k < per; k++) rounds.push({ red: [a[4 * k], a[4 * k + 1]], blue: [a[4 * k + 2], a[4 * k + 3]] });
  }
  let ms = rounds, cost = schedCost(ms, nT, M), best = ms.map(m => ({ red: [...m.red], blue: [...m.blue] })), bestC = cost;
  iters = iters || 40000;
  for (let it = 0; it < iters; it++) {
    const T = 4 * (1 - it / iters) + 0.02;
    const cand = ms.map(m => ({ red: [...m.red], blue: [...m.blue] }));
    const mv = rng();
    if (mv < 0.5) { // intercambiar dos equipos de lugares distintos
      const i = Math.floor(rng() * cand.length), j = Math.floor(rng() * cand.length);
      const si = [['red', 0], ['red', 1], ['blue', 0], ['blue', 1]][Math.floor(rng() * 4)], sj = [['red', 0], ['red', 1], ['blue', 0], ['blue', 1]][Math.floor(rng() * 4)];
      const a = cand[i][si[0]][si[1]], b = cand[j][sj[0]][sj[1]];
      if (a === b) continue;
      if (i !== j) { const mi = new Set([...cand[i].red, ...cand[i].blue]); const mj = new Set([...cand[j].red, ...cand[j].blue]); if (mi.has(b) && b !== a) continue; if (mj.has(a) && a !== b) continue; }
      cand[i][si[0]][si[1]] = b; cand[j][sj[0]][sj[1]] = a;
    } else if (mv < 0.8) { // intercambiar el orden de dos matches
      const i = Math.floor(rng() * cand.length), j = Math.floor(rng() * cand.length); [cand[i], cand[j]] = [cand[j], cand[i]];
    } else { // cambiar de color en un match
      const i = Math.floor(rng() * cand.length); const t = cand[i].red; cand[i].red = cand[i].blue; cand[i].blue = t;
    }
    const c = schedCost(cand, nT, M);
    if (c <= cost || rng() < Math.exp((cost - c) / T)) { ms = cand; cost = c; if (c < bestC) { bestC = c; best = cand.map(m => ({ red: [...m.red], blue: [...m.blue] })); } }
  }

}
function scheduleOptions(nTeams, maxM) {
  const perRound = nTeams / 4; const out = [];
  for (let m = 1; m <= maxM; m++) {
    const total = m * perRound; const perfect = (nTeams === 8 && m % 7 === 0);
    out.push({ m, total, perfect, rec: nTeams === 8 && (m === 7 || m === 8) });
  }
  return out;
}

// ===== Playoffs =====
function nextChooser(rank, alliances) {
  const used = new Set(alliances.flatMap(a => a.teams));
  const left = rank.filter(r => !used.has(r.id)); if (left.length < 2) return null;
  const chooser = left[0]; let opts = left.slice(1);
  if (chooser.rank === 1) opts = opts.filter(r => r.rank !== 2);
  return { chooser: chooser.id, options: opts.map(o => o.id) };
}
function buildSeries(alliances) {
  const s = []; let k = 1;
  for (let i = 0; i < alliances.length; i++) for (let j = i + 1; j < alliances.length; j++)
    s.push({ id: 'S' + (k++), a: alliances[i].id, b: alliances[j].id, stage: 'rr' });
  return s;
}
function seriesState(ser, matches) {
  const ms = matches.filter(m => m.seriesId === ser.id && isPub(m)).sort((x, y) => (x.order || 0) - (y.order || 0));
  let wa = 0, wb = 0, pa = 0, pb = 0;
  ms.forEach(m => { const aIsRed = m.redAlliance === ser.a; const sa = aIsRed ? m.result.red.score : m.result.blue.score, sb = aIsRed ? m.result.blue.score : m.result.red.score;
    pa += sa; pb += sb; if (sa > sb) wa++; else if (sb > sa) wb++; });
  const done = wa >= 2 || wb >= 2; const pending = matches.some(m => m.seriesId === ser.id && !isPub(m));
  return { wa, wb, pa, pb, played: ms.length, done, pending, winner: wa >= 2 ? ser.a : wb >= 2 ? ser.b : null };
}
function groupStandings(alliances, series, matches) {
  const st = {}; alliances.forEach(a => st[a.id] = { id: a.id, sw: 0, mw: 0, ml: 0, pts: 0 });
  series.filter(s => s.stage === 'rr').forEach(s => { const x = seriesState(s, matches);
    st[s.a].mw += x.wa; st[s.a].ml += x.wb; st[s.b].mw += x.wb; st[s.b].ml += x.wa; st[s.a].pts += x.pa; st[s.b].pts += x.pb;
    if (x.winner) st[x.winner === s.a ? s.a : s.b].sw++; });
  return Object.values(st).sort((p, q) => q.sw - p.sw || (q.mw - q.ml) - (p.mw - p.ml) || q.pts - p.pts);
}

// Plan automático de playoffs: crea de golpe los juegos 1 y 2 de cada serie (en orden, sin repetir alianza seguida).
// El juego 3 solo se crea si la serie queda 1-1. Devuelve { series, create:[serie,...] } o null.
function playoffPlan(P, matches) {
  const al = (P && P.alliances) || []; if (al.length < 2) return null;
  let series = ((P && P.series) || []).slice(); const out = { series: null, create: [] };
  if (!series.length) { series = buildSeries(al); out.series = series; }
  const real = matches.filter(m => m.type === 'playoff'); const vm = real.map(m => ({ ...m }));
  const cntOf = s => vm.filter(m => m.seriesId === s.id).length;
  const needs = s => { if (seriesState(s, real).done) return false; if (cntOf(s) < 2) return true; return !vm.some(m => m.seriesId === s.id && !isPub(m)); };
  const push = s => { const n = vm.reduce((x, m) => Math.max(x, m.num || 0), 0) + 1; vm.push({ type: 'playoff', seriesId: s.id, redAlliance: s.a, blueAlliance: s.b, num: n, status: 'scheduled' }); out.create.push(s); };
  const pickFrom = list => {
    const last = vm.slice().sort((a, b) => (a.num || 0) - (b.num || 0)).pop(); const busy = new Set(last ? [last.redAlliance, last.blueAlliance] : []);
    const minC = Math.min(...list.map(cntOf)); const c = list.filter(s => cntOf(s) <= minC + 1).sort((x, y) => cntOf(x) - cntOf(y));
    return c.find(s => !busy.has(s.a) && !busy.has(s.b)) || list.filter(s => cntOf(s) === minC)[0];
  };
  const rr = series.filter(s => s.stage === 'rr'); let guard = 0;
  while (guard++ < 60) { const open = rr.filter(needs); if (!open.length) break; push(pickFrom(open)); }
  if (rr.every(s => seriesState(s, real).done)) {
    let fin = series.find(s => s.stage === 'final');
    if (!fin) { const gs = groupStandings(al, series, real); fin = { id: 'F', a: gs[0].id, b: gs[1].id, stage: 'final' }; series = series.concat([fin]); out.series = series; }
    while (guard++ < 120 && needs(fin)) push(fin);

let fb = {};
async function initFirebase() {
  try {
    const app = initializeApp(FIREBASE_CONFIG);
    fb.auth = getAuth(app);
    try { fb.db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
    catch (e) { fb.db = getFirestore(app); }
    S.fbOk = true;
  } catch (e) { console.error(e); S.fbOk = false; }
}
const D = (p) => doc(fb.db, p);
const C = (p) => collection(fb.db, p);
const nowS = () => Date.now() + S.offset;

async function syncClock() {
  if (!fb.auth || !fb.auth.currentUser) return;
  try {
    let best = null; const ref = D('clock/' + fb.auth.currentUser.uid);
    for (let i = 0; i < 4; i++) {
      const t0 = Date.now(); await setDoc(ref, { t: serverTimestamp() });
      const snap = await getDocFromServer(ref); const t1 = Date.now();
      const sv = snap.data().t.toMillis(); const rtt = t1 - t0;
      if (!best || rtt < best.rtt) best = { rtt, off: sv - (t0 + t1) / 2 };
    }
    S.offset = best.off; S.offsetOk = true;
  } catch (e) { console.warn('clock', e); }
}

// ---------- Auth ----------
function isOwner(u) { return u && u.email && u.email.toLowerCase() === OWNER_EMAIL.toLowerCase(); }
async function loadRole() {
  const u = S.user; S.role = 'none'; if (!u) return;
  if (isOwner(u)) { S.role = 'head'; return; }
  try { const d = await getDoc(D('users/' + u.email.toLowerCase())); if (d.exists()) S.role = d.data().role || 'none'; } catch (e) { S.role = 'none'; }
}
async function loginGoogle() {
  const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
  try { await signInWithPopup(fb.auth, p); }
  catch (e) { if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') await signInWithRedirect(fb.auth, p); else if (e.code !== 'auth/popup-closed-by-user') toast('No se pudo iniciar sesión: ' + (e.code || e.message), true); }
}
async function logout() { await signOut(fb.auth); location.hash = '#/'; }

// ---------- Datos en tiempo real ----------
const subs = [];
function listen(path, fn, isDoc) {
  const ref = isDoc ? D(path) : C(path);
  const un = onSnapshot(ref, snap => { fn(snap); scheduleRender(); }, err => { console.warn('listen', path, err.code); });
  subs.push(un); return un;
}
function startData() {
  listen('teams', s => { S.teams = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0)); });
  listen('matches', s => { S.matches = s.docs.map(d => ({ id: d.id, ...d.data() })); });
  listen('scores', s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()); S.scores = o; });
  listen('control', s => { s.docs.forEach(d => S.ctl[d.id] = d.data()); });
  listen('config/settings', s => { S.settings = s.exists() ? s.data() : {}; }, true);
  listen('playoffs/state', s => { S.playoffs = s.exists() ? s.data() : {}; }, true);
}
let usersSub = null;
function startUsers() {
  if (usersSub || !(S.role === 'head')) return;
  usersSub = onSnapshot(C('users'), s => { S.users = s.docs.map(d => ({ id: d.id, ...d.data() })); scheduleRender(); }, () => { });
}

const team = id => S.teams.find(t => t.id === id) || { id, name: '?', number: '?' };
const tnum = id => { const t = team(id); if (t.number) return t.number; const m = /^(\S+?)\s*(\d+)$/.exec(t.name || ''); return m ? m[1].slice(0, 3).toUpperCase() + m[2] : (t.name || '?'); };
const tname = id => team(id).name || '?';
const tlabel = id => `${tnum(id)} · ${tname(id)}`;
const matchById = id => S.matches.find(m => m.id === id);
const sortMatches = (a, b) => (a.num || 0) - (b.num || 0) || String(a.id).localeCompare(String(b.id));
const matchesOf = type => S.matches.filter(m => m.type === type).sort(sortMatches);
const DR = { mid: null, docs: {}, dirty: false };
const dReset = () => { DR.mid = null; DR.docs = {}; DR.dirty = false; };
const draftOn = m => !!m && S.role === 'head' && route().view === 'head' && m.status === 'review';
const scoreDoc = (mid, color) => { const k = mid + '_' + color; return (DR.docs[k] && route().view === 'head') ? DR.docs[k] : S.scores[k]; };
const ctlM = () => S.ctl.match || {};

// liveResult: lo que se ve en vivo (stream, referees). La tarjeta roja NO se aplica hasta publicar.
function liveResult(m) { return m ? matchResult(m, scoreDoc(m.id, 'red'), scoreDoc(m.id, 'blue'), { hideRed: m.status !== 'published' }) : null; }

// ---------- Reloj del match (sincronizado) ----------
function elapsedMs() {
  const c = ctlM(); if (!c.status || c.status === 'idle') return null;
  if (c.status === 'running') return nowS() - c.startAtMs;
  return c.elapsedBase || 0;
}
function derivedStatus() {
  const c = ctlM(); const st = c.status || 'idle'; if (st === 'idle') return 'idle';
  const e = elapsedMs(); if (st === 'ended' || (e != null && e >= MATCH_MS)) return 'ended';
  return st;
}
function livePhase() { const st = derivedStatus(); if (st === 'idle') return 'idle'; if (st === 'ended') return 'ended'; return phaseAt(elapsedMs()); }
function clockText() {
  const st = derivedStatus(); if (st === 'idle') return '2:30'; const e = elapsedMs();
  if (e < 0) return String(Math.ceil(-e / 1000)); return fmtClock(MATCH_MS - e);
}

// ---------- Sonido ----------
let actx = null;
function enableSound() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); S.soundOn = true; beep(880, 120, .15); } catch (e) { }
  scheduleRender();
}
function beep(f, ms, vol) {
  if (!actx || !S.soundOn) return;
  const o = actx.createOscillator(), g = actx.createGain(); o.type = 'square'; o.frequency.value = f; g.gain.value = vol || .2;
  o.connect(g); g.connect(actx.destination); o.start(); g.gain.setValueAtTime(vol || .2, actx.currentTime + ms / 1000 - .02); g.gain.linearRampToValueAtTime(0, actx.currentTime + ms / 1000);
  o.stop(actx.currentTime + ms / 1000 + .02);
}
const seq = (list) => list.forEach(([f, ms, at]) => setTimeout(() => beep(f, ms), at));
let lastEl = null;
function soundTick(e) {
  if (e == null) { lastEl = null; return; }
  if (lastEl != null && e > lastEl && e - lastEl < 800) {
    const cross = t => lastEl < t && e >= t;
    [-3000, -2000, -1000].forEach(t => { if (cross(t)) beep(660, 150); });
    if (cross(0)) beep(990, 900);
    if (cross(AUTO_MS)) seq([[880, 220, 0], [880, 220, 320]]);
    if (cross(ENDGAME_MS)) seq([[880, 150, 0], [880, 150, 250], [880, 150, 500]]);
    if (cross(MATCH_MS)) beep(740, 1600);
  }
  lastEl = e;
}

// ---------- Render, toast, modal ----------
let rAF = 0, pendingRender = false;
function scheduleRender() { if (rAF) return; rAF = requestAnimationFrame(() => { rAF = 0; render(); }); }
function inputFocused() { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#app') && !a.closest('#modal'); }
document.addEventListener('focusout', () => { if (pendingRender) setTimeout(() => { if (!inputFocused()) { pendingRender = false; scheduleRender(); } }, 80); });
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', 3200);
}
function modal(html, opts) {
  const m = $('#modal'); m.innerHTML = `<div class="mbox ${opts && opts.wide ? 'wide' : ''}">${html}</div>`; m.classList.add('open');
}
function closeModal() { const m = $('#modal'); m.classList.remove('open'); m.innerHTML = ''; }
function confirmBox(title, text, okLabel, onOk, danger) {
  modal(`<h3>${esc(title)}</h3><p>${text}</p><div class="row end"><button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" id="cfmOk">${esc(okLabel)}</button></div>`);
  $('#cfmOk').onclick = () => { closeModal(); onOk(); };
}

// ---------- Router ----------
function route() {
  const h = (location.hash || '#/').replace(/^#\/?/, ''); const p = h.split('?')[0].split('/').filter(Boolean);
  return { view: p[0] || 'menu', a: p[1] || '', b: p[2] || '' };
}
function canView(v, a) {
  const r = S.role;
  if (v === 'menu' || v === 'stream' || v === 'rank') return true;
  if (r === 'head') return true;
  if (v === 'ref') return r === a;
  if (v === 'op') return r === 'operator';

function ctx() { const r = route(); const emb = r.view !== 'ref'; const mid = emb ? R.ovMid : r.b, color = emb ? R.ovColor : r.a; const m = matchById(mid); return { m, color, id: mid + '_' + color, ref: m && D('scores/' + mid + '_' + color) }; }
function dApply(m, color, loc, entry, tid) {
  if (DR.mid !== m.id) { dReset(); DR.mid = m.id; }
  ['red', 'blue'].forEach(c => { const k = m.id + '_' + c; if (!DR.docs[k] && S.scores[k]) DR.docs[k] = JSON.parse(JSON.stringify(S.scores[k])); });
  const d = DR.docs[m.id + '_' + color]; if (!d) return;
  if (loc) { const ks = loc.p.split('.'); let o = d; ks.slice(0, -1).forEach(k => { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; }); const lk = ks[ks.length - 1]; o[lk] = 'set' in loc ? loc.set : (+o[lk] || 0) + loc.inc; }
  if (entry) { d.log = (d.log || []).concat([{ ...entry, tid: tid || R.robot, ts: nowS(), by: S.user.email, id: uid8() }]); }
  DR.dirty = true; scheduleRender();
}
async function sw(fields, entry, tid, loc) {
  const { m, color, ref } = ctx(); if (!m || !canScore(m, color)) return;

async function createPlayoffMatch(s, P, matches) {
  const k = matches.filter(m => m.seriesId === s.id).length + 1; const aRed = k % 2 === 1;
  const A = P.alliances.find(a => a.id === s.a), B = P.alliances.find(a => a.id === s.b);
  const n = matches.filter(m => m.type === 'playoff').reduce((x, m) => Math.max(x, m.num || 0), 0) + 1;
  const id = s.id + '-' + k; const label = (s.stage === 'final' ? 'Final' : 'Playoff ' + s.id) + ' · J' + k;
  const red = (aRed ? A : B).teams, blue = (aRed ? B : A).teams; const b = writeBatch(fb.db);
  const data = { type: 'playoff', num: n, label, seriesId: s.id, red, blue, redAlliance: aRed ? A.id : B.id, blueAlliance: aRed ? B.id : A.id, status: 'scheduled' };
  b.set(D('matches/' + id), data);
  [['red', red], ['blue', blue]].forEach(([c, tm]) => { const robots = {}; tm.forEach(t => robots[t] = emptyRobot()); b.set(D('scores/' + id + '_' + c), { matchId: id, color: c, robots, confirmed: false, log: [] }); });
  await b.commit(); return { id, ...data };
}
// Arma solo los matches de playoffs que falten (series, orden y final). Devuelve los ids creados, en orden de juego.
async function playoffAdvance(over) {
  const P = S.playoffs || {}; const list = S.matches.map(m => over && m.id === over.id ? { ...m, ...over } : m);
  const plan = playoffPlan(P, list); if (!plan) return [];
  const series = plan.series || P.series; if (plan.series) await poWrite({ series: plan.series });
  const ids = []; for (const sr of plan.create) { const d = await createPlayoffMatch(sr, { ...P, series }, list); list.push(d); ids.push(d.id); }
  return ids;
}

const SIM = { busy: false, stop: false, msg: '', timers: [] };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const skillOf = tid => { let h = 7; for (const ch of String(tid)) h = (h * 31 + ch.charCodeAt(0)) | 0; return 0.35 + (Math.abs(h) % 100) / 100 * 0.6; };

async function simRun(label, fn) {

  SIM.busy = true; SIM.stop = false; simStatus(label + '…'); scheduleRender();
  try { await fn(); toast(label + ': listo'); } catch (e) { fail(e); }
  SIM.busy = false; simStatus('Listo.'); scheduleRender();
}
ACTS.simStop = () => { SIM.stop = true; SIM.timers.forEach(clearTimeout); SIM.timers = []; toast('Simulación detenida'); };
function simDocsFor(m, rng) { const out = {}; ['red', 'blue'].forEach(c => { const robots = {}; m[c].forEach(t => robots[t] = simRobot(skillOf(t), rng)); out[c] = robots; }); return out; }
async function simWriteScores(m, rng) {
  const d = simDocsFor(m, rng); const b = writeBatch(fb.db);
  ['red', 'blue'].forEach(c => b.set(D('scores/' + m.id + '_' + c), { matchId: m.id, color: c, robots: d[c], confirmed: true, log: [] })); await b.commit();
}
async function simPlay(m, rng) {

  await updateDoc(D('matches/' + m.id), { status: 'review' }); await sleep(120);
  const mm = matchById(m.id); await doPublish(mm, finalResult(mm)); await sleep(180);
}

function opPeople() {
  const list = peopleList();
  const card = p => { const on = featOn('person', p.id); const img = /^data:image\//.test(p.photo || '') ? `<img src="${esc(p.photo)}" style="width:72px;height:72px;border-radius:50%;object-fit:cover" alt="">` : `<div style="width:72px;height:72px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:26px">${esc((p.name || '?')[0] || '?')}</div>`;

    return `<div class="card" style="${on ? 'border-color:var(--or)' : ''}"><div class="row" style="align-items:flex-start;gap:12px"><div>${img}<label class="btn ghost sm" style="cursor:pointer;margin-top:6px;display:block;text-align:center">Foto<input type="file" accept="image/*" style="display:none" data-chg="pplPhoto" data-id="${esc(p.id)}"></label></div>
     <div class="grow" style="display:grid;gap:6px">${f('name', 'Nombre')}${f('role', 'Área o rol', 'Ej. CAD · Mecánica')}${f('team', 'Equipo / generación', 'Ej. Equipo 3')}${f('quote', 'Frase (opcional)')}</div></div>
     <div class="row" style="margin-top:10px">${on ? '<button class="btn ghost" data-act="ftOff">Quitar de la pantalla</button><span class="chip or">En pantalla</span>' : `<button class="btn primary" data-act="pplShow" data-id="${esc(p.id)}" ${p.name ? '' : 'disabled'}>Mostrar en pantalla</button>`}<button class="btn ghost sm" style="margin-left:auto" data-act="pplDel" data-id="${esc(p.id)}">Quitar</button></div></div>`; };
  return `<div class="grid2"><div>${prevCard()}
   <div class="card" style="margin-top:14px"><h3>Cargar varios de una vez</h3><p class="mut" style="font-size:13px;margin:4px 0 8px">Una persona por línea, con el formato <b>Nombre - Área - Equipo</b> (Área y Equipo son opcionales). Las fotos y frases se agregan después en cada perfil.</p>
    <textarea id="ppl_bulk" rows="6" style="width:100%" placeholder="Ana López - CAD - Equipo 3&#10;Luis Pérez - Mecánica">${esc(OPT.imp)}</textarea><button class="btn primary" style="margin-top:10px" data-act="pplImport">Cargar lista</button></div></div>
   <div><div class="row sb" style="margin-bottom:8px"><p class="mut" style="margin:0">Embajadores LamBot · ${list.length} perfiles</p><button class="btn" data-act="pplAdd">+ Agregar embajador</button></div>
    <div style="display:flex;flex-direction:column;gap:10px">${list.length ? list.map(card).join('') : '<div class="card"><p class="mut">Aún no hay perfiles. Agrégalos uno por uno o carga una lista.</p></div>'}</div></div></div>`;
}
const pplWrite = arr => stWrite({ people: arr }).catch(fail);
ACTS.pplAdd = () => pplWrite(peopleList().concat([{ id: 'p' + uid8(), name: '', role: '', team: '', quote: '', photo: '' }]));
ACTS.pplSave = el => pplWrite(peopleList().map(p => p.id === el.dataset.id ? { ...p, [el.dataset.f]: el.value.trim() } : p));
ACTS.pplDel = el => confirmBox('Quitar perfil', 'Se borra este embajador.', 'Quitar', () => { const f = ctlS().feature || {}; if (f.kind === 'person' && f.id === el.dataset.id) stWrite({ feature: { show: false } }); pplWrite(peopleList().filter(p => p.id !== el.dataset.id)); }, true);
ACTS.pplShow = el => stWrite({ feature: { kind: 'person', id: el.dataset.id, show: true, at: Date.now() }, mode: 'auto', scene: 'auto' }).then(() => toast('Embajador en pantalla')).catch(fail);
ACTS.pplImport = () => { const txt = ($('#ppl_bulk').value || '').split('\n').map(x => x.trim()).filter(Boolean); if (!txt.length) return toast('Escribe al menos una línea', true);
  const add = txt.map(l => { const [name, role, team] = l.split(/\s+[-–—]\s+/).map(x => (x || '').trim()); return { id: 'p' + uid8(), name: name || '', role: role || '', team: team || '', quote: '', photo: '' }; });
  OPT.imp = ''; pplWrite(peopleList().concat(add)).then(() => toast(add.length + ' perfiles cargados')); };
ACTS.pplPhoto = el => { const f = el.files && el.files[0]; if (!f) return; const id = el.dataset.id; const img = new Image(); const url = URL.createObjectURL(f);
  img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 240; const g = c.getContext('2d'); const k = Math.min(img.width, img.height); g.drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, 240, 240);
    const data = c.toDataURL('image/jpeg', 0.7); URL.revokeObjectURL(url); const nl = peopleList().map(p => p.id === id ? { ...p, photo: data } : p);
    if (JSON.stringify(ctlS()).length + data.length > 850000) return toast('Ya hay muchas fotos guardadas; quita alguna para agregar otra', true); pplWrite(nl); toast('Foto guardada'); };
  img.onerror = () => toast('No se pudo leer la imagen', true); img.src = url; el.value = ''; };
let prevHost = null;
function fitPrev() {
  const p = $('#prev'); const on = route().view === 'op' && p;
  if (!prevHost) { prevHost = document.createElement('div'); prevHost.style.cssText = 'position:fixed;overflow:hidden;z-index:5;pointer-events:none;border-radius:14px;display:none'; const f = document.createElement('iframe'); f.title = 'Stream'; f.style.cssText = 'width:1920px;height:1080px;border:0;transform-origin:top left'; f.src = location.href.split('#')[0] + '#/stream'; prevHost.appendChild(f); document.body.appendChild(prevHost); }
  if (!on) { prevHost.style.display = 'none'; return; }
  const r = p.getBoundingClientRect(); prevHost.style.display = 'block';
  prevHost.style.left = r.left + 'px'; prevHost.style.top = r.top + 'px'; prevHost.style.width = r.width + 'px'; prevHost.style.height = r.height + 'px';
  prevHost.firstChild.style.transform = `scale(${r.width / 1920})`;
}
new MutationObserver(() => fitPrev()).observe(document.getElementById('app') || document.body, { childList: true, subtree: true });
addEventListener('scroll', fitPrev, { passive: true });
addEventListener('resize', fitPrev);
addEventListener('hashchange', fitPrev);
const stWrite = o => setDoc(D('control/stream'), o, { merge: true });

ACTS.opNote = el => stWrite({ sceneNote: { [el.dataset.k]: el.value.trim() } }).catch(fail);
function camPanel() {
  const c = camCfg(); const seg = (k, l) => `<button class="${c.mode === k ? 'on' : ''}" data-act="opCamMode" data-v="${k}">${l}</button>`;
  const row = (i, o) => `<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px"><span style="min-width:74px">Cámara ${i}</span><button class="btn ghost sm" data-act="opCamRot" data-i="${i}" data-d="-90">⟲ 90°</button><button class="btn ghost sm" data-act="opCamRot" data-i="${i}" data-d="90">⟳ 90°</button><span class="chip mut">${(((+o.rot || 0) % 360) + 360) % 360}°</span>
    <label class="row" style="gap:4px"><input type="checkbox" ${o.flip ? 'checked' : ''} data-chg="opCamFlip" data-i="${i}"> Espejo</label><label class="row" style="gap:4px"><input type="checkbox" ${o.fit ? 'checked' : ''} data-chg="opCamFit" data-i="${i}"> Ver completa (sin recortar)</label></div>`;
  return `<div class="seg" style="margin:8px 0"><span style="display:contents">${seg('1', 'Cámara 1')}${seg('2', 'Cámara 2')}${seg('both', 'Ambas lado a lado')}</span></div>${row(1, c.c1)}${row(2, c.c2)}
   <div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="opCamReset">Reiniciar cámaras</button></div>
   <p class="mut" style="font-size:12px;margin-top:6px">Las cámaras son las que detecta la compu del stream: la 1 suele ser la webcam y la 2 el teléfono. Para usar el teléfono como webcam instala una app tipo Camo, Iriun o DroidCam en compu y teléfono; aparece como otra cámara. Si cambias o conectas cámaras, pulsa "Reiniciar cámaras".</p>`;
}
const camSet = (patch) => { const c = camCfg(); const nx = { mode: c.mode, c1: c.c1, c2: c.c2, reset: c.reset, ...patch }; return stWrite({ camCfg: nx }).catch(fail); };
ACTS.opCamMode = el => camSet({ mode: el.dataset.v });

ACTS.opCamFlip = el => { const c = camCfg(), k = el.dataset.i === '2' ? 'c2' : 'c1'; camSet({ [k]: { ...c[k], flip: el.checked } }); };

ACTS.opObsAuto = el => stWrite({ obsAuto: el.checked }).catch(fail);

ACTS.opTimerPre = el => { OP.label = el.dataset.l; OP.mins = +el.dataset.m; startTimer(); };
ACTS.opTimer = () => { OP.label = ($('#op_tl').value || 'Volvemos en').trim(); OP.mins = Math.max(1, Math.min(120, +$('#op_tm').value || 5)); startTimer(); };
function startTimer() { const ms = OP.mins * 60000; stWrite({ timer: { label: OP.label, endAtMs: nowS() + ms, durationMs: ms }, mode: 'auto', scene: 'auto' }).then(() => toast('Temporizador en pantalla')).catch(fail); }

ACTS.opAnnOff = () => stWrite({ announce: { ...(ctlS().announce || {}), show: false } }).catch(fail);

// ===== ARRANQUE =====
const SEED_TEAMS = [['Psycho Robotics', '2548'], ['A.X.I.O.M', '2785'], ['Pheonix', '2378'], ['Hazmat', '704'], ['Pragmatic Pibbles', '2104'], ['Atomix', '4036'], ['Vitronik 1', ''], ['Vitronik 2', '']];
async function seedIfNeeded() {
  if (S.role !== 'head') return;
  try {
    const meta = await getDoc(D('config/meta')); if (meta.exists()) return;
    const b = writeBatch(fb.db);
    SEED_TEAMS.forEach(([name, number], i) => b.set(D('teams/t' + (i + 1)), { name, number, robot: '', gp: false, sponsor: false, order: i + 1 }));
    b.set(D('config/meta'), { seeded: true, v: APP_VERSION }); b.set(D('config/settings'), DEFAULT_SETTINGS);
    b.set(D('playoffs/state'), { alliances: [], series: [] }); b.set(D('control/match'), { status: 'idle', elapsedBase: 0, startAtMs: null, matchId: null }); b.set(D('control/stream'), { mode: 'auto', scene: 'auto' });
    await b.commit();
  } catch (e) { console.warn('seed', e); }
}
async function boot() {
  await initFirebase(); scheduleRender();
  if (!S.fbOk) { S.authReady = true; scheduleRender(); return; }
  try { await getRedirectResult(fb.auth); } catch (e) { console.warn(e); }
  startData();
  let first = true;
  onAuthStateChanged(fb.auth, async u => {
    if (!u) { try { await signInAnonymously(fb.auth); } catch (e) { console.warn('anon', e.code); S.authReady = true; scheduleRender(); } return; }
    S.user = u.isAnonymous ? null : u; await loadRole(); S.authReady = true; scheduleRender();
    await syncClock(); scheduleRender(); setInterval(syncClock, 5 * 60000);
    await seedIfNeeded();
  });
}
boot();
